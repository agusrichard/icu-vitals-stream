x-pyspark-job: &pyspark-job
  image: apache/spark:4.1.1-python3
  user: root
  entrypoint: /opt/spark/bin/spark-submit
  depends_on:
    kafka:
      condition: service_healthy
    minio:
      condition: service_healthy
    schema-registry-init:
      condition: service_completed_successfully
  volumes:
    - ../pyspark/jobs:/opt/spark/jobs
    - spark-ivy-cache:/opt/.ivy2
  restart: unless-stopped

services:
  simulator:
    container_name: go-simulator
    build:
      context: ../simulator
      dockerfile: Dockerfile
      target: runtime
    environment:
      - PATIENTS=3
      - BROKERS=kafka:9092
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      schema-registry-init:
        condition: service_completed_successfully
  kafka:
    container_name: kafka
    image: confluentinc/cp-kafka:8.2.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 2-pVRRCrSWqlNUBBlKPRIQ  # hardcoded for local dev only
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 5s
      retries: 10
  kafka-init:
    image: confluentinc/cp-kafka:8.2.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic vitals.raw     --partitions 6 --replication-factor 1 --config retention.ms=3600000
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic vitals.scored  --partitions 1 --replication-factor 1 --config retention.ms=3600000
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic vitals.alerts  --partitions 1 --replication-factor 1 --config retention.ms=3600000
      echo 'Topics created.'
      "
    restart: "no"
  schema-registry:
    container_name: schema-registry
    image: confluentinc/cp-schema-registry:8.2.0
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/subjects" ]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8081:8081"
  schema-registry-init:
    image: alpine:3.21
    depends_on:
      schema-registry:
        condition: service_healthy
    volumes:
      - ./schemas:/schemas
      - ./scripts:/scripts
    entrypoint: [ "/bin/sh", "/scripts/register_schemas.sh" ]
    restart: "no"
  timescaledb:
    container_name: timescaledb
    image: timescale/timescaledb:2.26.3-pg16
    environment:
      POSTGRES_USER: icu
      POSTGRES_PASSWORD: icu
      POSTGRES_DB: icu
    ports:
      - "5433:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U icu" ]
      interval: 5s
      timeout: 3s
      retries: 10
  pgweb:
    image: sosedoff/pgweb
    container_name: timescaledb-pgweb
    depends_on:
      - timescaledb
    ports:
      - "8082:8081"
    environment:
      PGWEB_DATABASE_URL: "postgresql://icu:icu@timescaledb:5432/icu?sslmode=disable"
    restart: always
  scorer:
    container_name: rust-scorer
    build:
      context: ../scorer
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      schema-registry-init:
        condition: service_completed_successfully
    environment:
      - BROKERS=kafka:9092
      - GROUP_ID=scorer
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - DATABASE_URL=postgresql://icu:icu@timescaledb:5432/icu
    restart: unless-stopped
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/delta-lake;
      exit 0
      "
    restart: "no"
  pyspark:
    image: apache/spark:4.1.1-python3
    container_name: pyspark
    entrypoint: /opt/spark/bin/spark-class
    command: org.apache.spark.deploy.master.Master
    depends_on:
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ../pyspark/jobs:/opt/spark/jobs
    ports:
      - "8080:8080"   # Spark master web UI
    restart: unless-stopped
  pyspark-raw:
    <<: *pyspark-job
    container_name: pyspark-raw
    command:
      - "--master"
      - "local[*]"
      - "--conf"
      - "spark.jars.ivy=/opt/.ivy2"
      - "--packages"
      - "org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.1,org.apache.spark:spark-avro_2.13:4.1.1,io.delta:delta-spark_4.1_2.13:4.1.0,org.apache.hadoop:hadoop-aws:3.4.1"
      - "--py-files"
      - "/opt/spark/jobs/shared.py"
      - "/opt/spark/jobs/vitals_raw_5min_agg.py"
    ports:
      - "4040:4040"   # Spark Application UI
  pyspark-scored:
    <<: *pyspark-job
    container_name: pyspark-scored
    command:
      - "--master"
      - "local[*]"
      - "--conf"
      - "spark.jars.ivy=/opt/.ivy2"
      - "--packages"
      - "org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.1,org.apache.spark:spark-avro_2.13:4.1.1,io.delta:delta-spark_4.1_2.13:4.1.0,org.apache.hadoop:hadoop-aws:3.4.1"
      - "--py-files"
      - "/opt/spark/jobs/shared.py"
      - "/opt/spark/jobs/vitals_scored_1hr_agg.py"
    ports:
      - "4041:4040"   # Spark Application UI
  delta-reader:
    container_name: delta-reader
    build:
      context: ../delta-reader
      dockerfile: Dockerfile
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - SCORED_1HR_TABLE=s3://delta-lake/vitals_scored_1hr_agg
    ports:
      - "5001:5000"
    restart: unless-stopped
  grafana:
    image: grafana/grafana:13.0.1
    container_name: grafana
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_PLUGINS_PREINSTALL_SYNC: yesoreyeram-infinity-datasource
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - grafana-data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    restart: unless-stopped
volumes:
  kafka-data:
  timescaledb-data:
  minio-data:
  grafana-data:
  spark-ivy-cache: